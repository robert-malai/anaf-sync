# Publish to PyPI on a version tag (v*) via trusted publishing (OIDC) — no
# API token is stored in the repo. PyPI side: the project's trusted publisher
# must name this repo, this filename (release.yml), and the `pypi` environment.
# The full CI gates re-run here so a tag can never ship an artifact that a
# broken branch produced. Once PyPI has the distribution, the same tag gets a
# GitHub release carrying the sdist + wheel and the per-OS tray bundles; its
# prose comes from `release-notes/<tag>.md` when the tag ships one, and from
# GitHub's generated notes when it does not.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; the jobs that need more re-declare it (a job-level
# block replaces this one rather than adding to it).
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # With the tray extra, matching ci.yml's Linux leg: without PySide6 every
      # Qt base class is `Any` and `mypy --strict` fails across the tray modules.
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Sync dependencies (with tray extra)
        run: uv sync --extra tray --group qt
      - name: Tests
        run: uv run pytest -q
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Black format
        run: uv run black --check src tests
      - name: Mypy (strict)
        run: uv run mypy src

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0
      - name: Tag matches the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "pyproject version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The desktop bundles, built by the same workflow that builds them on demand.
  # Deliberately not gated on `gates`: it runs its own (on all three OSes), and
  # the freeze is the slowest thing on the critical path to the release.
  bundle:
    uses: ./.github/workflows/release-tray.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anaf-sync
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # PyPI first, GitHub release second: the release is the announcement, and it
  # should never point at a version `pip install` cannot reach yet. This is the
  # only job that touches releases — the tray bundles arrive here as artifacts
  # rather than attaching themselves, so the release is never created empty by
  # whichever job happened to finish first. Re-runnable: an existing release for
  # the tag is updated in place rather than failing.
  github-release:
    needs: [publish, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release, attach the distribution to it
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full tag history — the compare link needs the predecessor
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: anaf-sync-tray-*
          merge-multiple: true
          path: dist/
      - name: Assemble the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/notes.md"
          previous="$(git tag -l 'v*' --sort=-v:refname | grep -A1 -x -F "${tag}" | tail -n1)"
          if [ "${previous}" = "${tag}" ]; then
            previous=""  # the oldest tag has no predecessor to compare against
          fi
          file="release-notes/${tag}.md"
          if [ -f "${file}" ]; then
            # An H1 on the first line is the release title; the rest is the body.
            first="$(head -n1 "${file}")"
            case "${first}" in
              '# '*) title="${first#\# }"; tail -n +2 "${file}" > "${notes}" ;;
              *)     title="anaf-sync ${tag#v}"; cp "${file}" "${notes}" ;;
            esac
            if [ -n "${previous}" ]; then
              printf '\n**Full changelog**: %s/compare/%s...%s\n' \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${previous}" "${tag}" >> "${notes}"
            fi
          else
            echo "no ${file} — using GitHub's generated notes" >&2
            title="anaf-sync ${tag#v}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${tag}" \
              ${previous:+-f previous_tag_name="${previous}"} \
              --jq .body > "${notes}"
          fi
          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"
      # The title reaches bash through the environment, never through `${{ }}`:
      # an expression is spliced into the script *before* bash parses it, so a
      # title carrying backticks — `unknown`, say — would be run as a command
      # and vanish from the release. Notes are prose, and prose has backticks.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${TITLE}" --notes-file "${NOTES}"
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* --title "${TITLE}" --notes-file "${NOTES}"
          fi
