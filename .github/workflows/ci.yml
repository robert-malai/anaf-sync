# Credential-free gates on every push/PR: the fake-client test suite, ruff,
# black, and mypy --strict, across the supported Python versions. The tests
# additionally run on macOS and Windows — path handling and the scheduler
# layer (schtasks / systemd user / launchd) are platform-dispatched and their
# shared code must stay green everywhere.
#
# The Linux leg installs the optional `tray` extra so the PySide6 UI code is
# exercised (headless, QT_QPA_PLATFORM=offscreen) and mypy can read PySide6's
# stubs; the macOS/Windows legs stay core-only, which also proves the package
# still builds and tests without the extra (the tray tests skip via importorskip).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes back to the repo — checkout is the only token consumer.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # PySide6's offscreen platform plugin needs these shared libraries.
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      # Every leg gets the tray extra. When macOS and Windows synced core-only,
      # `importorskip` quietly dropped the whole Qt suite there, so the tray was
      # first exercised on Windows inside the *release* bundle job — where a
      # failure costs a half-published release (v0.5.0: the probe's open handle
      # meets Windows' refusal to unlink an open file). Platform-specific tray
      # behaviour has to be a CI concern, not a release-day one.
      - name: Sync dependencies (with tray extra)
        run: uv sync --extra tray --group qt
      # junit_family=legacy is what Codecov's test analytics parser expects —
      # it keeps the full module path in classname, so flaky tests stay
      # attributable across the matrix.
      - name: Tests
        run: uv run pytest -q --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      # Every leg uploads; Codecov merges them per commit — the macOS/Windows
      # legs execute scheduler branches the ubuntu leg never does. A Codecov
      # outage must not break the gates, hence fail_ci_if_error stays off.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
      # Unlike coverage, this one runs even when the suite is red — a failed
      # run is exactly the one whose test results are worth reading. Same
      # action as the coverage upload, told to carry the other report type:
      # `test-results-action` is deprecated in favour of exactly this.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          report_type: test_results
          # Named rather than searched for: the searcher would also sweep up
          # the coverage report the step above already uploaded.
          files: ./junit.xml
          disable_search: true
          fail_ci_if_error: false
      # The static gates are platform-independent; run them once per Python on
      # the Linux leg, which has PySide6 installed (mypy reads its stubs).
      - name: Ruff lint
        if: runner.os == 'Linux'
        run: uv run ruff check src tests
      - name: Black format
        if: runner.os == 'Linux'
        run: uv run black --check src tests
      - name: Mypy (strict)
        if: runner.os == 'Linux'
        run: uv run mypy src
